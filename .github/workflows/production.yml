name: Production

on:
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: namespace-profile-website
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Format, lint and type check
        run: nix fmt -- --ci

  deploy:
    name: Deploy Prod
    needs: check
    runs-on: namespace-profile-website
    permissions:
      contents: read
    environment:
      name: production
      url: https://haoxiangliew.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Deploy
        run: bun run alchemy:deploy prod --yes --no-input
